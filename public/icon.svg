    <path d="M150 20 C75 20 15 80 15 155 C15 245 150 360 150 360 C150 360 285 245 285 155 C285 80 225 20 150 20 Z" fill="#ffffff" />
    <!-- Center circle cutout -->
    <circle cx="150" cy="155" r="70" fill="#0f766e" />
    <!-- Service Wrench / Spark symbol -->
    <path d="M135 115 L165 115 L165 140 L190 140 L190 170 L165 170 L165 195 L135 195 L135 170 L110 170 L110 140 L135 140 Z" fill="url(#accent)" rx="6" />
    <!-- Small star / checkmark -->
    <polygon points="150,132 155,145 168,145 157,153 161,166 150,158 139,166 143,153 132,145 145,145" fill="#ffffff" />
  </g>
</svg>
